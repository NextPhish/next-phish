# Standalone production stack; do not merge with docker-compose.yml.
name: nextphish-production

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${DB_USER:?Set DB_USER}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${DB_NAME:?Set DB_NAME}
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-app: &app
  env_file: .env
  environment: *app-environment
  restart: unless-stopped
  init: true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.production
      target: migrate
    restart: "no"
    profiles: [maintenance]

  next-app:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.production
      target: next-app
    environment:
      <<: *app-environment
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"

  static-server:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.production
      target: static-server
    environment:
      <<: *app-environment
      STATIC_SERVER_PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3001/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.production
      target: worker
    stop_grace_period: 2m

volumes:
  postgres-data:
  redis-data:
